<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend> Đăng ký </legend>
    <form target="_self"  autocomplete="on">
        <label for="name"> tên của bạn</label><br>
        <input type="text" id="name" placeholder="tên của bạn" size="10px" required ><br>

        <label for="number"> số điện thoại</label><br>
        <input type="number" id="number"><br>
        <label for="password"> mật khẩu của bạn</label><br>
        <input type="password" id="password"><br>
        <label for="name"> email của bạn</label><br>
        <input type="email" id="email"  size="10px"><br>
        <label for="date"> ngày đăng kí</label><br><input type="date" id="date"  size="10px"><br>
        <label for="color"> màu yêu thích</label><br><input type="color" id="color"  size="10px"><br>
       <label for="gender"> tên của bạn</label><br>
        <input type="radio" id="nam nhat" name="gender"><label for="nam nhat"> năm nhất</label>
        <input type="radio" id="nam hai" name="gender"><label for="nam hai"> năm hai</label><br>
        <input type="checkbox" id="2"><label for="2"> táo</label>
        <input type="checkbox" id="3"><label for="3"> bắp cải</label><br>
        <select size="5">
            <option>Nam Định</option>
            <option selected>Lào Cai</option>
            <option> Huế</option>
        </select><br>
        <label for="bt">Giới thiệu bản thân></label>
        <textarea rows="3" cols="3"></textarea><br>

        <button type="reset">làm lại</button>
        <button type="submit">Gửi</button>
    </form>
    </fieldset>
</body>
</html>
